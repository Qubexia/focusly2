# Zakerly production — nginx reverse proxy
# Admin dashboard: https://zakerlyai.tech/
# Backend API:    https://zakerlyai.tech/v1/
# Swagger:        https://zakerlyai.tech/docs
# Privacy policy: https://zakerlyai.tech/privacy

upstream focaly_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    server_name zakerlyai.tech www.zakerlyai.tech;

    client_max_body_size 25m;

    # Let's Encrypt challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://focaly_api;
    }

    # Public legal page, served by the API. Exact match so it wins over the
    # SPA catch-all below without shadowing any future /privacy* admin route.
    location = /privacy {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://focaly_api;
    }

    location /docs {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://focaly_api;
    }

    location /docs-json {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://focaly_api;
    }

    location / {
        root /var/opt/focusly2/focaly-admin/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/zakerlyai.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zakerlyai.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.zakerlyai.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zakerlyai.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name zakerlyai.tech www.zakerlyai.tech;
    return 404; # managed by Certbot




}